<!DOCTYPE html>
<html lang="en"> 
    <head> 
        <meta charset="UTF-8">
        <meta name="viewport" content="width device-width" initial-scale =1.0> 
        <title> Bangladeshi Clothes | Add Botique </title>
        <link rel="stylesheet" href="Bangladeshi.css"> 

    </head>
<body>

    <section class="products-section">

        <h2>
            Our Bangladeshi Collection
        </h2>

        <p class="intro">
            Traditional elegance with beautiful
            fabrics and detailed designs.
        </p>


        <div
            id="productsContainer"
            class="products-container">
        </div>

    </section>

    <section
        id="detailsSection"
        class="details-section">

        <button
            class="back-button"
            onclick="closeDetails()">

            ← Back to Collection

        </button>


        <div class="details-container">


            <div>

                <img
                    id="detailsImage"
                    src=""
                    alt="Product"
                >

            </div>


            <div class="details-info">

                <p
                    id="detailsCategory"
                    class="category">
                </p>


                <h2 id="detailsName">
                </h2>


                <h3 id="detailsPrice">
                </h3>


                <p>
                    <strong>Material:</strong>
                    <span id="detailsMaterial"></span>
                </p>


                <p>
                    <strong>Color:</strong>
                    <span id="detailsColor"></span>
                </p>


                <p>
                    <strong>Size:</strong>
                    <span id="detailsSize"></span>
                </p>


                <p>
                    <strong>Suitable for:</strong>
                    <span id="detailsSuitable"></span>
                </p>


                <p>
                    <strong>Description:</strong>
                </p>

                <p
                    id="detailsDescription"
                    class="description">
                </p>


                <button class="order-button"
                        onclick="orderProduct()">

                    Order Now

                </button>

            </div>

        </div>

    </section> 
    <footer>
Adda Boutique · Cultural Wear Collection
</footer>

    <script src="Bangladeshi.js"></script>

</body>

</html>
